x-database-url: &database-url mysql+pymysql://${MYSQL_USER:?set MYSQL_USER}:${MYSQL_PASSWORD_URLENCODED:?set MYSQL_PASSWORD_URLENCODED}@mysql:3306/ocurate?charset=utf8mb4

services:
  # One-shot: creates the passages table and seeds the Passages, then exits.
  # The api starts only after it finished, so a fresh `docker compose up` is ready to use.
  migrate:
    build: .
    command: ["python", "-m", "app.passages.passage_store"]
    environment:
      OCURATE_DATABASE_URL: *database-url
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      OCURATE_DATABASE_URL: *database-url
      OCURATE_API_KEY: ${OCURATE_API_KEY:-}
      OCURATE_TOKEN_SECRET: ${OCURATE_TOKEN_SECRET:-}
      OCURATE_CALLBACK_URL: ${OCURATE_CALLBACK_URL:-}
      OCURATE_CALLBACK_SECRET: ${OCURATE_CALLBACK_SECRET:-}
      OCURATE_ALLOWED_ORIGINS: ${OCURATE_ALLOWED_ORIGINS:-}
      OCURATE_DEV_MODE: ${OCURATE_DEV_MODE:-0}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      retries: 5

  mysql:
    image: mysql:8.4.3
    # MYSQL_USER / MYSQL_PASSWORD only take effect when the mysql-data volume is
    # first created; after changing them, run `docker compose down -v` to reset.
    environment:
      MYSQL_DATABASE: ocurate
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 30

volumes:
  mysql-data:
